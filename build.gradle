plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.116'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server() }
    }
    mods {
        beyond_craftlines { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

def defaultBeyondDimensionsJar = layout.projectDirectory.file(
        "../BeyondDimensions/build/libs/beyonddimensions-${minecraft_version}-neoforge-${beyond_dimensions_version}.jar")
def beyondDimensionsJar = providers.gradleProperty('beyond_dimensions_jar')
        .map { file(it) }
        .getOrElse(defaultBeyondDimensionsJar.asFile)

dependencies {
    implementation files(beyondDimensionsJar)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: 'MIT',
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            beyond_dimensions_version: beyond_dimensions_version,
            jei_version: jei_version
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    from 'src/main/templates'
    expand replaceProperties
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir 'versions/1.21.1/src/main/resources'
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
