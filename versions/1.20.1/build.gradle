plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def prepareVersionSources = tasks.register('prepareVersionSources', Sync) {
    from '../../src/main/java'
    exclude 'com/amicbeam/beyondcraftlines/BeyondCraftlines.java'
    exclude 'com/amicbeam/beyondcraftlines/CraftlinesConfig.java'
    exclude 'com/amicbeam/beyondcraftlines/common/init/CraftlinesItems.java'
    exclude 'com/amicbeam/beyondcraftlines/common/init/CraftlinesBlocks.java'
    exclude 'com/amicbeam/beyondcraftlines/common/init/CraftlinesBlockEntities.java'
    exclude 'com/amicbeam/beyondcraftlines/common/init/CraftlinesMenus.java'
    exclude 'com/amicbeam/beyondcraftlines/common/event/CraftlinesEvents.java'
    exclude 'com/amicbeam/beyondcraftlines/common/block/CraftlineProvisionerBlock.java'
    exclude 'com/amicbeam/beyondcraftlines/client/integration/jade/CraftlinesJadePlugin.java'
    exclude 'com/amicbeam/beyondcraftlines/common/network/CraftlinesNetwork.java'
    exclude 'com/amicbeam/beyondcraftlines/common/runtime/CraftlineProvisionerBlockEntity.java'
    exclude 'com/amicbeam/beyondcraftlines/common/runtime/NativeFurnaceRegistry.java'
    exclude 'com/amicbeam/beyondcraftlines/common/runtime/NativeFurnaceAutomation.java'
    into layout.buildDirectory.dir('generated/versionSources/main/java')
    filteringCharset = 'UTF-8'
    filter { line -> line
            .replace('net.neoforged.api.distmarker', 'net.minecraftforge.api.distmarker')
            .replace('net.neoforged.bus.api', 'net.minecraftforge.eventbus.api')
            .replace('net.neoforged.fml', 'net.minecraftforge.fml')
            .replace('net.neoforged.neoforge', 'net.minecraftforge')
            .replace('net.minecraft.network.RegistryFriendlyByteBuf', 'com.amicbeam.beyondcraftlines.compat.protocol.RegistryFriendlyByteBuf')
            .replace('net.minecraft.network.codec.ByteBufCodecs', 'com.amicbeam.beyondcraftlines.compat.protocol.ByteBufCodecs')
            .replace('net.minecraft.network.codec.StreamCodec', 'com.amicbeam.beyondcraftlines.compat.protocol.StreamCodec')
            .replace('net.minecraft.network.protocol.common.custom.CustomPacketPayload', 'com.amicbeam.beyondcraftlines.compat.protocol.CustomPacketPayload')
            .replace('net.minecraft.world.item.crafting.CraftingInput', 'com.amicbeam.beyondcraftlines.compat.crafting.CraftingInput')
            .replace('net.minecraft.world.item.crafting.RecipeHolder', 'com.amicbeam.beyondcraftlines.compat.crafting.RecipeHolder')
            .replace('net.minecraftforge.network.handling.IPayloadContext', 'com.amicbeam.beyondcraftlines.compat.protocol.IPayloadContext')
            .replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
            .replace('ResourceLocation.parse(', 'new ResourceLocation(')
            .replace('net.minecraft.resources.new ResourceLocation(', 'new net.minecraft.resources.ResourceLocation(')
            .replace('ItemStack.isSameItemSameComponents(', 'ItemStack.isSameItemSameTags(')
            .replace('IStackKey.STREAM_CODEC', 'com.amicbeam.beyondcraftlines.compat.ForgePayloadCodecs.STACK_KEY')
            .replace('UUIDUtil.STREAM_CODEC', 'com.amicbeam.beyondcraftlines.compat.ForgePayloadCodecs.UUID')
            .replace('PacketDistributor.sendToServer(', 'com.amicbeam.beyondcraftlines.common.network.CraftlinesNetwork.sendToServer(')
            .replace('PacketDistributor.sendToPlayer(', 'com.amicbeam.beyondcraftlines.common.network.CraftlinesNetwork.sendToPlayer(')
            .replace('PacketDistributor.sendToPlayersInDimension(', 'com.amicbeam.beyondcraftlines.common.network.CraftlinesNetwork.sendToPlayersInDimension(')
            .replace('org.jetbrains.annotations', 'javax.annotation')
            .replace('javax.annotation.NotNull', 'javax.annotation.Nonnull')
            .replace('@NotNull', '@Nonnull')
            .replace('TooltipContext context', 'net.minecraft.world.level.Level level')
            .replace(', net.minecraft.world.item.Item.TooltipContext.of(minecraft.level)', '')
            .replace('manager.getOrderedRecipes()', 'com.amicbeam.beyondcraftlines.compat.RecipeManagerCompat.ordered(manager)')
            .replace('level.getRecipeManager().getOrderedRecipes()', 'com.amicbeam.beyondcraftlines.compat.RecipeManagerCompat.ordered(level.getRecipeManager())')
            .replace('level.getRecipeManager().byKey(', 'com.amicbeam.beyondcraftlines.compat.RecipeManagerCompat.byKey(level.getRecipeManager(), ')
            .replace('.getFirst()', '.get(0)')
            .replace('node.children.getLast()', 'node.children.get(node.children.size() - 1)')
            .replace('BaseNetFurnaceBlockEntity<?>', 'NetFurnaceBlockEntity')
            .replace('com.wintercogs.beyonddimensions.common.block.entity.BaseNetFurnaceBlockEntity', 'com.wintercogs.beyonddimensions.common.block.entity.NetFurnaceBlockEntity')
            .replace('net.minecraftforge.capabilities.Capabilities', 'net.minecraftforge.common.capabilities.ForgeCapabilities')
            .replace('Capabilities.ItemHandler.BLOCK', 'ForgeCapabilities.ITEM_HANDLER')
            .replace('level.getCapability(ForgeCapabilities.ITEM_HANDLER, position,', 'com.amicbeam.beyondcraftlines.compat.ForgeCapabilityAccess.get(level, ForgeCapabilities.ITEM_HANDLER, position,')
            .replace('level.getCapability((net.minecraftforge.capabilities.BlockCapability) capability,', 'com.amicbeam.beyondcraftlines.compat.ForgeCapabilityAccess.get(level, (net.minecraftforge.common.capabilities.Capability) capability,')
            .replace('template.copyWithCount(request)', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(template, request)')
            .replace('stack.copyWithCount(1)', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(stack, 1)')
            .replace('item.copyWithCount(1)', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(item, 1)')
            .replace('remainder.copyWithCount(1)', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(remainder, 1)')
            .replace('candidate.copyWithCount(Math.max(1, candidate.getCount()))', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(candidate, Math.max(1, candidate.getCount()))')
            .replace('candidate.copyWithCount(1)', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(candidate, 1)')
            .replace('selected.getReadOnlyStack().copyWithCount(1)', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(selected.getReadOnlyStack(), 1)')
            .replace('itemKey.getReadOnlyStack().copyWithCount(1)', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(itemKey.getReadOnlyStack(), 1)')
            .replace('itemKey.getReadOnlyStack().copyWithCount(', 'com.amicbeam.beyondcraftlines.compat.ItemStackCompat.copy(itemKey.getReadOnlyStack(), ')
            .replace(', HolderLookup.Provider registries', '')
            .replace(', registries)', ')')
            .replace('serializeNBT(registries)', 'serializeNBT()')
            .replace('player.registryAccess()', '')
            .replace('new Factory<>(RecipeOrderSavedData::new, RecipeOrderSavedData::load), NAME', 'RecipeOrderSavedData::load, RecipeOrderSavedData::new, NAME')
            .replace('new Factory<>(BindingSavedData::new, BindingSavedData::load), NAME', 'BindingSavedData::load, BindingSavedData::new, NAME')
            .replace('storage.getNet()', 'com.amicbeam.beyondcraftlines.compat.BeyondDimensionsCompat.networkFor(player, storage)')
            .replace('DimensionsNet.getPrimaryNetFromPlayer(player)', 'DimensionsNet.getNetFromPlayer(player)')
            .replace('net.minecraftforge.fml.common.EventBusSubscriber', 'net.minecraftforge.fml.common.Mod.EventBusSubscriber')
            .replace('net.minecraftforge.client.event.RegisterMenuScreensEvent', 'net.minecraftforge.fml.event.lifecycle.FMLClientSetupEvent')
            .replace('RegisterMenuScreensEvent event', 'FMLClientSetupEvent event')
            .replace('event.register(CraftlinesMenus.', 'net.minecraft.client.gui.screens.MenuScreens.register(CraftlinesMenus.')
            .replace('output.accept(CraftlinesItems.NETWORK_LINKER)', 'output.accept(CraftlinesItems.NETWORK_LINKER.get())')
            .replace('output.accept(CraftlinesItems.CRAFTLINE_PROVISIONER)', 'output.accept(CraftlinesItems.CRAFTLINE_PROVISIONER.get())')
            .replace('player.openMenu(', 'net.minecraftforge.network.NetworkHooks.openScreen(player, ')
            .replace('serverPlayer.openMenu(', 'net.minecraftforge.network.NetworkHooks.openScreen(serverPlayer, ')
            .replace('List::getFirst', 'values -> values.get(0)')
            .replace('ResourceLocation::parse', 'ResourceLocation::new')
            .replace('net.minecraft.core.HolderLookup.Provider registries', 'net.minecraft.core.RegistryAccess registries')
            .replace('readExternalWait(value)', 'readExternalWait(value, null)')
            .replace('readExternalWait(encoded)', 'readExternalWait(encoded, null)')
            .replace('writeExternalWait(value, job.externalWait())', 'writeExternalWait(value, job.externalWait(), null)')
            .replace('writeExternalWait(step, execution.externalWait())', 'writeExternalWait(step, execution.externalWait(), null)')
            .replace('readReserved(value)', 'readReserved(value, null)')
            .replace('readReservedList(job, "reserved")', 'readReservedList(job, "reserved", null)')
            .replace('"network_baseline_stacks")', '"network_baseline_stacks", null)')
            .replace('outputs(recipe)', 'outputs(recipe, null)')
            .replace('List<KeyAmount> outputs = outputs(recipe, null);', 'List<KeyAmount> outputs = outputs(recipe, registries);')
            .replace('net.minecraft.world.item.Item.TooltipContext.of(minecraft.level), ', '')
            .replace('net.minecraft.world.item.Item.TooltipContext.of(minecraft.level),', '')
            .replace('deserializeNBT(encoded.getCompound("key"), minecraft.level.registryAccess())', 'deserializeNBT(encoded.getCompound("key"))')
            .replace('public boolean mouseScrolled(double mouseX, double mouseY, double scrollX, double scrollY)', 'public boolean mouseScrolled(double mouseX, double mouseY, double scrollY)')
            .replace('super.mouseScrolled(mouseX, mouseY, scrollX, scrollY)', 'super.mouseScrolled(mouseX, mouseY, scrollY)')
            .replace('renderBackground(graphics, mouseX, mouseY, partialTick)', 'renderBackground(graphics)')
            .replace('consumer.addVertex(pose,', 'consumer.vertex(pose.pose(),')
            .replace('.setColor(', '.color(')
            .replace('.setUv(', '.uv(')
            .replace('.setOverlay(', '.overlayCoords(')
            .replace('.setLight(', '.uv2(')
            .replace('.setNormal(pose,', '.normal(pose.normal(),')
            .replace('location.id().equals(PROVISIONER)', 'new ResourceLocation(location.getNamespace(), location.getPath()).equals(PROVISIONER)')
            .replace('location.variant()', 'location.getVariant()')
            .replace('(RegistryFriendlyByteBuf) data', 'new RegistryFriendlyByteBuf(data)')
            .replace('                && !location.getVariant().equals("inventory") ? new ProvisionerMaterialModel(model) : model);',
                    '                ? new ProvisionerMaterialModel(model) : model);')
    }
}
tasks.named('prepareVersionSources') {
    outputs.upToDateWhen { false }
}
sourceSets.main.java.srcDir prepareVersionSources
sourceSets.main.resources.srcDir '../../src/main/resources'
def prepareVersionTests = tasks.register('prepareVersionTests', Sync) {
    from '../../src/test/java'
    into layout.buildDirectory.dir('generated/versionSources/test/java')
    filteringCharset = 'UTF-8'
    filter { line -> line.replace('.getFirst()', '.get(0)') }
}
sourceSets.test.java.setSrcDirs([prepareVersionTests])

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server() }
    }
    mods { beyond_craftlines { sourceSet sourceSets.main } }
}

repositories {
    mavenCentral()
    maven { name = 'Jared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
}

def cachedBd = fileTree(dir: "${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/curse.maven/beyonddimensions-1222890", include: '**/beyonddimensions-1222890-7737205.jar').files.toList()
dependencies {
    implementation files(cachedBd.isEmpty() ? file('/private/tmp/missing-beyonddimensions-1.20.1.jar') : cachedBd.first())
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: 'MIT', mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            beyond_dimensions_version: beyond_dimensions_version, jei_version: jei_version]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    from 'src/main/templates'
    expand replaceProperties
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.named('test', Test) { useJUnitPlatform() }
