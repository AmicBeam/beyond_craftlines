plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10'
    id 'net.neoforged.moddev' version '2.0.116'
}

version = "${mod_version}+${minecraft_version}-for-bd0.8"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

// Only this build replaces the shared files that target BD 0.7.
def overrides = fileTree('src/main/java').matching { include '**/*.java' }.files.collect {
    file('src/main/java').toPath().relativize(it.toPath()).toString()
}
def prepareSharedSources = tasks.register('prepareSharedSources', Sync) {
    from '../../src/main/java'
    exclude overrides
    exclude 'com/amicbeam/beyondcraftlines/mixin/bd/DimensionsNetGuiMixin.java'
    inputs.property('networkLookupApi', 'getPrimaryNetFromPlayer')
    filteringCharset = 'UTF-8'
    filesMatching('com/amicbeam/beyondcraftlines/common/data/DeviceBindingRegistry.java') {
        filter { line -> line.replace('DimensionsNet.getNetFromPlayer(', 'DimensionsNet.getPrimaryNetFromPlayer(') }
    }
    into layout.buildDirectory.dir('generated/sharedSources/main/java')
}
sourceSets.main.java.srcDir prepareSharedSources
sourceSets.test.java.srcDir '../../src/test/java'
def prepareSharedResources = tasks.register('prepareSharedResources', Sync) {
    from '../../src/main/resources'
    exclude 'beyond_craftlines.mixins.json'
    into layout.buildDirectory.dir('generated/sharedResources/main')
}
sourceSets.main.resources.srcDir prepareSharedResources

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); gameDirectory = file("build/smoke-server"); programArgument "--nogui" }
    }
    mods {
        beyond_craftlines { sourceSet sourceSets.main }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { name = 'Wintercogs'; url = 'https://maven.wintercogs.com/releases' }
        }
        filter { includeGroup 'com.wintercogs.beyonddimensions'; includeGroup 'dev.compixel' }
    }
    exclusiveContent {
        forRepository { maven { name = 'RuntimeLibraries'; url = 'https://repo.maven.apache.org/maven2' } }
        filter { includeGroup 'org.jetbrains'; includeGroupByRegex 'org\\.jetbrains\\..*' }
    }
    mavenCentral()
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

// BD embeds this library in its release JAR; development runs need it on the legacy classpath.
def extractPinyin = tasks.register('extractPinyin', Copy) {
    from { zipTree(configurations.compileClasspath.find {
        it.name == "beyonddimensions-${minecraft_version}-neoforge-${beyond_dimensions_version}.jar"
    }) }
    include 'META-INF/jarjar/tinypinyin-2.0.3.jar'
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('generated/runtimeLibraries')
}

dependencies {
    implementation("com.wintercogs.beyonddimensions:beyonddimensions-${minecraft_version}-neoforge:${beyond_dimensions_version}") { transitive = false }
    // A single Kotlin provider in development, matching the standalone player installation.
    implementation "dev.compixel:compixel-neoforge-${minecraft_version}-with-kotlin:${compixel_version}"
    additionalRuntimeClasspath files(layout.buildDirectory.file('generated/runtimeLibraries/tinypinyin-2.0.3.jar')).builtBy(extractPinyin)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:emi:${emi_version}"
    runtimeOnly "maven.modrinth:emi:${emi_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Planner contract tests call the real Minecraft-backed DTOs with synthetic storage keys.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: 'GNU GPL 3.0',
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            beyond_dimensions_version: beyond_dimensions_version,
            jei_version: jei_version,
            guideme_version: guideme_version
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    from '../../src/main/templates'
    filter { line -> line.replace('versionRange="[${beyond_dimensions_version},)"', 'versionRange="[${beyond_dimensions_version},0.9)"') }
    expand replaceProperties
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir '../1.21.1/src/main/resources'
neoForge.ideSyncTask generateModMetadata
tasks.named('processResources', ProcessResources) {
    from('../../LICENSE') { into 'META-INF' }
    from('../../THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach { includeEmptyDirs = false }
